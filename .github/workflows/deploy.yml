name: Deploy to Kubernetes

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: smrithigk/devopsified-task-manager-backend
      FRONTEND_IMAGE: smrithigk/devopsified-task-manager-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Show deployment images
        run: |
          echo "Backend image: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}"

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/task-manager.yaml